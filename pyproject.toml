[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tesla-charge-coordinator"
version = "0.1.0"
description = "Coordinate charging across multiple Tesla vehicles so they never charge simultaneously"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raphael Malikian", email = "rtmalikian@gmail.com" }]
keywords = ["tesla", "fleet-api", "ev-charging", "multi-ev", "smart-charging", "off-peak", "home-automation"]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]

[project.scripts]
tcc = "tesla_charge_coordinator.cli:main"

[project.urls]
Homepage = "https://github.com/rtmalikian/tesla-charge-coordinator"
Issues = "https://github.com/rtmalikian/tesla-charge-coordinator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
